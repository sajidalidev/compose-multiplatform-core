import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    // tv-material's android target redirects to the real, already-published
    // androidx.tv:tv-material artifact (same pattern as compose/material3/material3,
    // compose/foundation/foundation and window/window-core in this fork): android consumers
    // get Google's upstream artifact unchanged; this fork only adds the tvOS klib variants
    // built from the in-tree AOSP copy below.
    redirect("androidx.tv") {
        androidLibrary {
            compileSdk = 35
            namespace = "androidx.tv.material"
        }
    }
    tvos()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain.dependencies {
            api("androidx.annotation:annotation:1.8.1")
            api(project(":compose:animation:animation"))
            api(project(":compose:foundation:foundation"))
            api(project(":compose:foundation:foundation-layout"))
            api(project(":compose:runtime:runtime"))
            api(project(":compose:ui:ui"))
            api(project(":compose:ui:ui-graphics"))
            api(project(":compose:ui:ui-text"))
            api(project(":compose:ui:ui-util"))
        }

        commonTest.dependencies {
            implementation(kotlin("test"))
        }
    }
}

androidx {
    name = "TV Material"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    mavenVersion = LibraryVersions.TV_MATERIAL
    inceptionYear = "2022"
    description = "build TV applications using controls that adhere to Material Design Language."
    legacyDisableKotlinStrictApiMode = true
    metalavaK2UastEnabled = false
}
