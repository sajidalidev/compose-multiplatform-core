<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compose Tizen TV Demo</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #101014;
        }

        /* A TV has no pointer and no text selection; hiding the cursor keeps a stray
           mouse-capable remote from leaving one on screen. */
        * {
            cursor: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #composeTarget {
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="demo.js"></script>
</head>

<body>
<div id="composeTarget"></div>
</body>
</html>
